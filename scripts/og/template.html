<!doctype html>
<!--
  Open Graph card template (1200×630) for public/og/*.jpg.
  Serve the repo root statically, open template.html?s=<url-encoded spec from specs.json> at 1200×630
  and save a JPEG screenshot as public/og/<spec.file>.jpg (e.g. with Playwright page.screenshot).
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Geologica'; font-weight: 500 800; src: url(/src/assets/fonts/geologica-lat.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02C6, U+2000-206F, U+20AC, U+2122, U+2190-2199, U+2212; }
  @font-face { font-family: 'Geologica'; font-weight: 500 800; src: url(/src/assets/fonts/geologica-cyr.woff2) format('woff2'); unicode-range: U+0400-045F, U+2116; }
  @font-face { font-family: 'Onest'; font-weight: 400 700; src: url(/src/assets/fonts/onest-lat.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02C6, U+2000-206F, U+20AC, U+2122, U+2190-2199, U+2212; }
  @font-face { font-family: 'Onest'; font-weight: 400 700; src: url(/src/assets/fonts/onest-cyr.woff2) format('woff2'); unicode-range: U+0400-045F, U+2116; }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400 600; src: url(/src/assets/fonts/jbmono-lat.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02C6, U+2000-206F, U+20AC, U+2122, U+2190-2199, U+2212; }
</style>
<style>
  /* the site's palette (src/index.css): warm near-black, cream text, warm greys, one solid accent */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: rgb(14 10 7); }
  body { font-family: Onest, sans-serif; color: #f6efe4; -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: rgb(14 10 7); }
  .copy { position: absolute; left: 80px; top: 72px; bottom: 64px; display: flex; flex-direction: column; }
  .brand { font-family: Geologica, sans-serif; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .eyebrow { margin-top: 56px; font-size: 20px; color: #9d9182; }
  h1 { font-family: Geologica, sans-serif; font-weight: 600; letter-spacing: -0.045em; line-height: 0.98; margin-top: 14px; }
  .home h1 { margin-top: 0; }
  .sub { margin-top: 28px; font-size: 26px; line-height: 1.4; color: #c8bcad; }
  .foot { margin-top: auto; font-size: 19px; color: rgb(234 123 48); }
  .portrait { position: absolute; right: 56px; bottom: 0; height: 590px; }
  .browser { position: absolute; right: -80px; top: 116px; width: 540px; border-radius: 12px; overflow: hidden; background: #0b0806;
    box-shadow: 0 0 0 1px rgb(255 236 214 / .1); }
  .bar { height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 12px; background: rgb(23 18 14); }
  .bar i { width: 9px; height: 9px; border-radius: 50%; background: rgb(255 236 214 / .16); }
  .bar span { margin-left: 10px; font: 12px 'JetBrains Mono', monospace; color: #9d9182; }
  .browser img { display: block; width: 100%; }
  .phone { position: absolute; width: 190px; aspect-ratio: 390/844; border-radius: 28px; padding: 5px; background: #0b0806;
    box-shadow: 0 0 0 1px rgb(255 236 214 / .12); }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 23px; display: block; }
  .note { position: absolute; right: 80px; bottom: 64px; font-size: 17px; color: #9d9182; }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
  // spec arrives as JSON in ?s=: {kind: 'home'|'case', lang, title, size, sub, foot, eyebrow?, image?, url?, phones?, demoLabel?}
  const s = JSON.parse(new URLSearchParams(location.search).get('s'));
  const card = document.getElementById('card');
  const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const home = s.kind === 'home';
  let visual = '';
  if (home) {
    visual = '<img class="portrait" src="/src/assets/portrait/portrait-1200.webp">';
  } else if (s.phones) {
    visual = `<div class="phone" style="right:270px;top:96px"><img src="${s.phones[0]}"></div><div class="phone" style="right:56px;top:132px"><img src="${s.phones[1]}"></div>`;
  } else {
    visual = `<div class="browser"><div class="bar"><i></i><i></i><i></i><span>${esc(s.url)}</span></div><img src="${s.image}"></div>`;
  }
  if (s.demoLabel) visual += `<span class="note">${esc(s.demoLabel)}</span>`;
  card.innerHTML = `${visual}
    <div class="copy${home ? ' home' : ''}" style="width:${home ? 620 : 560}px">
      ${home ? '' : `<div class="brand">${s.lang === 'ru' ? 'Чингиз Салихов' : 'Chingiz Salikhov'}</div>`}
      ${s.eyebrow ? `<div class="eyebrow">${esc(s.eyebrow)}</div>` : ''}
      <h1 style="font-size:${s.size}px">${esc(s.title)}</h1>
      <p class="sub">${s.sub}</p>
      <div class="foot">${esc(s.foot)}</div>
    </div>`;
</script>
</body>
</html>
