<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0a07" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <!-- Scroll-reveal styles apply only under html.js. If the app never hydrates (script blocked,
       very slow network), drop the class so the prerendered content isn't left hidden. -->
  <script>
    document.documentElement.classList.add('js');
    setTimeout(function () {
      if (!document.documentElement.hasAttribute('data-hydrated')) document.documentElement.classList.remove('js');
    }, 5000);
  </script>
  <!--app-head-->
</head>

<body>
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/entry-client.tsx"></script>
</body>

</html>
