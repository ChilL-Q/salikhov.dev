<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <!-- Each language has its own page (src/i18n/langs.ts). A visitor who picked English or Kazakh before
       keeps it: on the root page the saved choice redirects before anything is drawn. -->
  <script>
    try {
      var saved = localStorage.getItem('app_language');
      if (location.pathname === '/' && (saved === 'en' || saved === 'kz')) location.replace('/' + saved + location.search + location.hash);
    } catch (e) {}
  </script>
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <!--app-head-->
</head>

<body>
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
